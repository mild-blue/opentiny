name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main

# Only keep the latest run per PR/branch; cancel superseded runs to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    # Drive the headless bucket through webdriverio directly instead of an
    # external Selenium server (see Gruntfile.js).
    env:
      BEDROCK_NO_SELENIUM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # No yarn.lock is committed, so cache yarn's global cache directory
      # (keyed on the manifests) rather than setup-node's lockfile cache.
      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'modules/*/package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build

      - name: Type check
        run: yarn tsc

      # The tinymce module is named "opentiny", so bedrock serves it at
      # /project/opentiny, but the tests hardcode /project/tinymce. bedrock falls
      # back to serving /project from the repo root, so a root tinymce symlink
      # makes every /project/tinymce/... path resolve to modules/tinymce.
      - name: Expose tinymce at repo root for test URLs
        run: ln -sfn modules/tinymce tinymce

      - name: Report Chrome version
        run: google-chrome --version

      - name: Run tests
        run: yarn test
